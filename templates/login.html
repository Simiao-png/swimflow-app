{% extends "base.html" %}

{% block title %}Login - SwimFlow{% endblock %}

{% block content %}

<div class="pagina-auth">

    <div class="auth-container">

        <form
            action="/logar"
            method="POST"
            class="auth-card"
        >

            <h1>🏊 SwimFlow</h1>

            <p>Faça login para acessar seus treinos</p>

            {% if erro %}
            <div class="mensagem-erro">
                {{ erro }}
            </div>
            {% endif %}

            <div class="form-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn-salvar"
            >
                Entrar
            </button>

            <a
                href="/cadastro-usuario"
                class="link-auth"
            >
                Criar conta
            </a>

            <a
                href="/recuperar-senha"
                class="link-auth"
            >
                Esqueci minha senha
            </a>

        </form>

    </div>

</div>

{% endblock %}
