<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>SwimFlow</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="pagina-auth">

    <div class="auth-container">

        <form
            action="/logar"
            method="POST"
            class="auth-card"
        >

            <h1>🏊 SwimFlow</h1>

            <p>Faça login para acessar seus treinos</p>
                {% if erro %}
                <div class="mensagem-erro">
                     {{ erro }}
                </div>
                {% endif %}


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Senha</label>

                <input
                    type="password"
                    name="senha"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-salvar"
            >

                Entrar

            </button>


            <a
                href="/cadastro-usuario"
                class="link-auth"
            >

                Criar conta
            
            </a>
            <a
                href="/recuperar-senha"
                class="link-auth"
                >
            
                Esqueci minha senha
            </a>

            
        </form>

    </div>

</body>

</html>
