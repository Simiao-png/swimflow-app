{% extends "base.html" %}

{% block title %}Nova Senha - SwimFlow{% endblock %}

{% block content %}

<div class="pagina-auth">

    <div class="auth-container">

        <form
            action="/salvar-nova-senha"
            method="POST"
            class="auth-card"
        >

            <h1>🔐 Nova Senha</h1>

            <p>
                Crie sua nova senha
            </p>

            <input
                type="hidden"
                name="email"
                value="{{ request.args.get('email') }}"
            >

            <div class="form-group">

                <label for="nova_senha">Nova senha</label>

                <input
                    type="password"
                    id="nova_senha"
                    name="nova_senha"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirmar_senha">
                    Confirmar nova senha
                </label>

                <input
                    type="password"
                    id="confirmar_senha"
                    name="confirmar_senha"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn-salvar"
            >
                Salvar nova senha
            </button>

            <a
                href="/login"
                class="link-auth"
            >
                Voltar ao login
            </a>

        </form>

    </div>

</div>

{% endblock %}
