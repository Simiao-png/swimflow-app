<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alterar senha</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="pagina-auth">

    <div class="auth-container">

        <form
            action="/salvar-nova-senha"
            method="POST"
            class="auth-card"
        >

            <h1>🔐 Alterar senha</h1>

            <p>
                Digite sua senha atual e a nova senha
            </p>

            <div class="form-group">

                <label>Senha atual</label>

                <input
                    type="password"
                    name="senha_atual"
                    required
                >

            </div>

            <div class="form-group">

                <label>Nova senha</label>

                <input
                    type="password"
                    name="nova_senha"
                    required
                >

            </div>

            <div class="form-group">

                <label>Confirmar nova senha</label>

                <input
                    type="password"
                    name="confirmar_senha"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn-auth"
            >

                Salvar nova senha

            </button>

            <a
                href="/"
                class="link-auth"
            >
                Voltar
            </a>

        </form>

    </div>

</body>

</html>
