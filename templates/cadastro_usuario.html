{% extends "base.html" %}

{% block title %}Cadastro - SwimFlow{% endblock %}

{% block content %}

<div class="pagina-auth">

    <div class="auth-container">

        <form
            action="/cadastrar-usuario"
            method="POST"
            class="auth-card"
        >

            <h1>🏊 Criar Conta</h1>

            <p>Cadastre-se no app</p>

            <div class="form-group">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn-salvar"
            >
                Criar conta
            </button>

            <a
                href="/login"
                class="link-auth"
            >
                Já tenho conta
            </a>

        </form>

    </div>

</div>

{% endblock %}
