<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>SwimFlow</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="pagina-auth">

    <div class="auth-container">

        <form
            action="/cadastrar-usuario"
            method="POST"
            class="auth-card"
        >

            <h1>🏊 Criar Conta</h1>

            <p>Cadastre-se no app</p>


            <div class="form-group">

                <label>Nome</label>

                <input
                    type="text"
                    name="nome"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Senha</label>

                <input
                    type="password"
                    name="senha"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-salvar"
            >

                Criar conta

            </button>


            <a
                href="/login"
                class="link-auth"
            >

                Já tenho conta

            </a>

        </form>

    </div>

</body>

</html>
